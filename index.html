<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FCS Logic Model</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img class="logo on-light" src="assets/fcs-logo-color.png" alt="Focused Community Strategies">
      <img class="logo on-dark" src="assets/fcs-logo-white.png" alt="Focused Community Strategies">
      <span id="logo-text" class="logo-text" hidden>Focused Community Strategies</span>
      <h1 class="area-title" id="area-title">Logic Model</h1>
      <div class="area-lead" id="area-lead"></div>
      <label class="toggle" for="fcs-only"><input type="checkbox" id="fcs-only"> Programs FCS runs or owns only</label>
    </div>
    <div>
      <div class="areas">
        <div class="areas-label">FCS areas (click to filter):</div>
        <div class="area-btns" id="area-btns"></div>
      </div>
      <div class="tools"><button class="btn" id="print" hidden>Print or save as PDF</button></div>
    </div>
  </header>
  <main class="model-scroll">
    <div class="model" id="model"></div>
  </main>
</div>
<footer><div class="wrap"><span>Focused Community Strategies | Logic model, second draft</span><span>Each result is read separately in Historic South Atlanta and Thomasville Heights, never averaged.</span></div></footer>
<script src="data/logic-model.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
